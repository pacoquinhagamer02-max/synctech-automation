/* ── Reveal com rede de segurança ── */
function Reveal({ children, delay = 0, className = '', as = 'div' }) {
  const ref = useRef(null);
  const [visivel, setVisivel] = useState(semMovimento);
  useEffect(() => {
    if (semMovimento) return;
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisivel(true); obs.disconnect(); }
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    obs.observe(el);
    /* Se o observer falhar, o conteúdo não pode ficar preso invisível —
       landing em branco é pior que landing sem animação. */
    const rede = setTimeout(() => setVisivel(true), 1600);
    return () => { obs.disconnect(); clearTimeout(rede); };
  }, []);
  return html`
    <${as} ref=${ref}
      className=${className + ' transition-all duration-700 ease-out ' + (visivel ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8')}
      style=${{ transitionDelay: visivel ? delay + 'ms' : '0ms' }}>
      ${children}
    <//>`;
}

/* Anima do zero na primeira aparição; depois acompanha o slider na hora. */
function useNumeroAnimado(alvo, ativo) {
  const [v, setV] = useState(0);
  const jaAnimou = useRef(false);
  useEffect(() => {
    if (!ativo) return;
    if (semMovimento || jaAnimou.current) { setV(alvo); return; }
    jaAnimou.current = true;
    const t0 = performance.now(), dur = 1100;
    let raf;
    const passo = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      setV(alvo * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(passo); else setV(alvo);
    };
    raf = requestAnimationFrame(passo);
    /* requestAnimationFrame não roda em aba oculta (nem quando o navegador
       resolve estrangular). Sem esta rede, a calculadora ficaria travada em
       R$ 0 — um número errado é pior que um número sem animação. */
    const rede = setTimeout(() => setV(alvo), dur + 400);
    return () => { cancelAnimationFrame(raf); clearTimeout(rede); };
  }, [alvo, ativo]);
  return v;
}

/* ═══════════════ Barra de progresso ═══════════════ */
function BarraProgresso() {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    let raf = null;
    const calcular = () => {
      raf = null;
      const alcance = document.documentElement.scrollHeight - window.innerHeight;
      setPct(alcance > 0 ? Math.min(100, (window.scrollY / alcance) * 100) : 0);
    };
    const aoRolar = () => { if (raf === null) raf = requestAnimationFrame(calcular); };
    calcular();
    window.addEventListener('scroll', aoRolar, { passive: true });
    window.addEventListener('resize', aoRolar);
    return () => {
      window.removeEventListener('scroll', aoRolar);
      window.removeEventListener('resize', aoRolar);
      if (raf !== null) cancelAnimationFrame(raf);
    };
  }, []);
  return html`
    <div className="fixed inset-x-0 top-0 z-[60] h-[3px]" aria-hidden="true">
      <div className="h-full bg-gradient-to-r from-violeta to-lilas transition-[width] duration-150 ease-out"
           style=${{ width: pct + '%' }}></div>
    </div>`;
}

const CUSTO_MES = 397; // plano Negócio, mensal

function Slider({ rotulo, valor, min, max, passo, onChange, formata, dica }) {
  const pct = ((valor - min) / (max - min)) * 100;
  const id = 'sl-' + rotulo.replace(/\W+/g, '-').toLowerCase();
  return html`

        <output htmlFor=${id} className="font-disp text-xl font-bold text-lilas">${formata(valor)}</output>
      </div>
      <input id=${id} type="range" min=${min} max=${max} step=${passo} value=${valor}
             onInput=${(e) => onChange(Number(e.target.value))}
             onChange=${(e) => onChange(Number(e.target.value))}
             style=${{ '--pct': pct + '%' }} />
      ${dica && html`<p className="mt-2 text-xs text-txt3">${dica}</p>`}
    </div>`;
}

function Calculadora() {
  const [clientes, setClientes] = useState(80);
  const [ticket, setTicket] = useState(60);
  const [retorno, setRetorno] = useState(40);
  const [horas, setHoras] = useState(2);
  const [ativo, setAtivo] = useState(semMovimento);
  const ref = useRef(null);

  useEffect(() => {
    if (semMovimento) return;
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setAtivo(true); obs.disconnect(); }
    }, { threshold: 0.25 });
    obs.observe(el);
    const rede = setTimeout(() => setAtivo(true), 2500);
    return () => { obs.disconnect(); clearTimeout(rede); };
  }, []);

  const r = useMemo(() => {
    /* Ganho extra = recuperação de quem ficava sem resposta (15%)
       + reativação de quem não voltava (8% dos que não retornam).
       Horas economizadas ficam de fora do dinheiro de propósito: somar
       hora como se fosse receita infla o número sem lastro. */
    const porResposta = clientes * 0.15 * ticket;
    const porReativacao = clientes * ((100 - retorno) / 100) * 0.08 * ticket;
    const ganhoMes = porResposta + porReativacao;
    const horasAno = horas * 22 * 12;
    const sobraAno = (ganhoMes - CUSTO_MES) * 12;
    const roi = ((ganhoMes - CUSTO_MES) / CUSTO_MES) * 100;
    return { ganhoMes, horasAno, sobraAno, roi };
  }, [clientes, ticket, retorno, horas]);

  return html`
    <section id="calculadora" className="relative px-5 py-24 lg:py-32">
      <div className="mx-auto max-w-6xl">
        <${Reveal}>
          <${TituloSecao} tag="Calculadora de ROI"
            titulo=${html`Quanto você ganha <span className="texto-gradiente">com a automação</span>`}
            sub="Arraste os números do seu negócio e veja a estimativa na hora." />
        <//>
        <${Reveal} delay=${90}>
          <div ref=${ref} className="card overflow-hidden rounded-3xl p-7 sm:p-10">
            <div className="grid gap-10 lg:grid-cols-[1fr_1.05fr] lg:gap-14">
              <div className="grid content-start gap-8">
                <${Slider} rotulo="Clientes atendidos por mês" valor=${clientes} min=${20} max=${300} passo=${5}
                           onChange=${setClientes} formata=${num} />
                <${Slider} rotulo="Ticket médio" valor=${ticket} min=${20} max=${500} passo=${10}
                           onChange=${setTicket} formata=${brl} />
                <${Slider} rotulo="Taxa de retorno atual" valor=${retorno} min=${10} max=${80} passo=${5}
                           onChange=${setRetorno} formata=${(v) => v + '%'}
                           dica="Quanto menor, mais gente tem pra reativar." />
                <${Slider} rotulo="Horas por dia respondendo" valor=${horas} min=${0.5} max=${8} passo=${0.5}
                           onChange=${setHoras} formata=${(v) => String(v).replace('.', ',') + 'h'} />
              </div>

              <div className="grid content-start gap-4 sm:grid-cols-2">
                <div className="sm:col-span-2">
                  <${CartaoResultado} rotulo="Ganho extra estimado por mês" valor=${r.ganhoMes}
                                      destaque=${true} ativo=${ativo} formata=${brl} />
                </div>
                <${CartaoResultado} rotulo="Retorno sobre o investimento" valor=${r.roi} sufixo="%"
                                    ativo=${ativo} formata=${num} />
                <${CartaoResultado} rotulo="Horas devolvidas por ano" valor=${r.horasAno} sufixo="h"
                                    ativo=${ativo} formata=${num} />
                <div className="sm:col-span-2">
                  <${CartaoResultado} rotulo=${'Sobra no ano, já pagando o plano Negócio de ' + brl(CUSTO_MES) + '/mês'}
                                      valor=${r.sobraAno} ativo=${ativo} formata=${brl} />
                </div>
                <p className="text-xs leading-relaxed text-txt3 sm:col-span-2">
                  Estimativa calculada a partir dos números que você informou — não é promessa de
                  resultado. O que a SyncTech garante é a operação rodando, não o faturamento do seu negócio.
                </p>
                <div className="sm:col-span-2">
                  <${BtnPrimario} href="#contato" className="w-full">
                    Quero validar esses números <${Ico} d=${ICONES.seta} className="h-4 w-4" />
                  <//>
                </div>
              </div>
            </div>
          </div>
        <//>
      </div>
    </section>`;
}

/* ═══════════════ Contato ═══════════════ */
function Contato() {
  const [nome, setNome] = useState('');
  const [tel, setTel] = useState('');
  const [erros, setErros] = useState({});
  const [enviado, setEnviado] = useState(false);

  const soDigitos = (s) => s.replace(/\D/g, '');
  const mascarar = (v) => {
    const d = soDigitos(v).slice(0, 11);
    if (d.length <= 2) return d;
    if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
    if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  };

  const enviar = (e) => {
    e.preventDefault();
    const novos = {};
    if (nome.trim().length < 2) novos.nome = 'Escreve seu nome pra gente saber com quem fala.';
    const d = soDigitos(tel);
    if (d.length < 10 || d.length > 11) novos.tel = 'Coloca o WhatsApp com DDD, ex: (31) 98655-1626.';
    setErros(novos);
    if (Object.keys(novos).length) return;

    /* Registra o lead no Make.com (Gmail + Google Sheets). keepalive porque
       logo em seguida a aba pode ir pro WhatsApp e cancelar a requisição. */
    fetch(LEADS_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tipo: 'lead',
        nome: nome.trim(),
        telefone: d,
        timestamp: new Date().toISOString(),
        origem: 'Site SyncTech'
      }),
      keepalive: true
    }).catch(function(err){ console.error('Falha ao enviar lead pro webhook:', err); });

    const msg = 'Olá! Vim pelo site da SyncTech.\n\n' +
                'Nome: ' + nome.trim() + '\n' +
                'WhatsApp: ' + mascarar(tel) + '\n\n' +
                'Quero um diagnóstico gratuito para automatizar meu negócio!';
    const url = wa(msg);
    setEnviado(true);
    /* Se o navegador bloquear o popup, não deixa o usuário na mão. */
    const janela = window.open(url, '_blank', 'noopener');
    if (!janela) window.location.href = url;
  };

  const campo = (id, rot, valor, setar, tipo, ph, auto, erro) => html`
    <div>
      <label htmlFor=${id} className="mb-2 block text-sm font-semibold text-txt2">${rot}</label>
      <input id=${id} type=${tipo} value=${valor} placeholder=${ph} autoComplete=${auto}
             inputMode=${tipo === 'tel' ? 'numeric' : undefined}
             aria-invalid=${erro ? 'true' : 'false'} aria-describedby=${erro ? id + '-erro' : undefined}
             onInput=${(e) => { setar(e.target.value); setErros((x) => Object.assign({}, x, { [id]: undefined })); }}
             className=${'w-full rounded-xl border bg-base/60 px-4 py-3.5 text-txt placeholder:text-txt3 transition ' +
               'focus:border-violeta focus:outline-none focus:ring-2 focus:ring-violeta/40 ' +
               (erro ? 'border-red-400' : 'border-linha')} />
      ${erro && html`<p id=${id + '-erro'} role="alert" className="mt-2 text-sm text-red-400">${erro}</p>`}
    </div>`;

  const garantias = ['Sem cartão de crédito', 'Resposta em até 2h', 'Cancele quando quiser'];

  return html`
    <section id="contato" className="relative px-5 py-24 lg:py-32">
      <div className="mx-auto max-w-5xl">
        <${Reveal}>
          <${TituloSecao} tag="Pronto para começar?"
            titulo=${html`Automatize seu negócio <span className="texto-gradiente">ainda essa semana</span>`}
            sub="Diagnóstico 100% gratuito e sem compromisso. Resposta em até 2 horas." />
        <//>
        <${Reveal} delay=${90}>
          <div className="card grid gap-10 rounded-3xl p-8 sm:p-11 lg:grid-cols-2 lg:gap-14">
            <div>
              <h3 className="font-disp text-2xl font-bold">O que acontece depois que você envia</h3>
              <ol className="mt-7 grid gap-5">
                ${['Abre o WhatsApp com a mensagem já escrita — é só apertar enviar.',
                   'A gente responde em até 2 horas e marca o diagnóstico de 30 minutos.',
                   'Você recebe o que dá pra automatizar no seu caso, com preço fechado.'].map((t, i) => html`
                  <li key=${i} className="flex items-start gap-3.5">
                    <span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-violeta/20 font-disp text-sm font-extrabold text-lilas">${i + 1}</span>
                    <span className="text-sm leading-relaxed text-txt2">${t}</span>
                  </li>`)}
              </ol>
              <ul className="mt-8 grid gap-2.5">
                ${garantias.map((g) => html`
                  <li key=${g} className="flex items-center gap-2.5 text-sm text-txt3">
                    <span className="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-violeta/20 text-violeta">
                      <${Ico} d=${ICONES.check} className="h-3 w-3" />
                    </span>${g}
                  </li>`)}
              </ul>
            </div>

            <form onSubmit=${enviar} noValidate className="grid content-start gap-5">
              ${campo('nome', 'Seu nome', nome, setNome, 'text', 'Ex: Maria Silva', 'name', erros.nome)}
              ${campo('tel', 'Seu WhatsApp', mascarar(tel), setTel, 'tel', '(31) 98655-1626', 'tel', erros.tel)}
              <button type="submit"
                      className="glow-cta mt-1 flex items-center justify-center gap-2 rounded-xl bg-violeta px-6 py-4 font-bold text-white transition hover:bg-[#8A46F5]">
                Quero diagnóstico gratuito <${Ico} d=${ICONES.seta} className="h-4 w-4" />
              </button>
              <p role="status" aria-live="polite" className="min-h-[20px] text-sm text-txt3">
                ${enviado
                  ? html`<span className="font-semibold text-lilas">Abrimos o WhatsApp com sua mensagem pronta.</span> Se não abriu, toque no botão verde no canto da tela.`
                  : 'Seus dados vão pro WhatsApp da SyncTech e pro nosso cadastro de contato.'}
              </p>
            </form>
          </div>
        <//>
      </div>
    </section>`;
}

/* ═══════════════ Botão flutuante ═══════════════ */
function BotaoFlutuante() {
  const [visivel, setVisivel] = useState(false);
  useEffect(() => {
    const f = () => setVisivel(window.scrollY > 420);
    f();
    window.addEventListener('scroll', f, { passive: true });
    return () => window.removeEventListener('scroll', f);
  }, []);
  return html`
    <a href=${wa(MSG_DIAG)} target="_blank" rel="noopener"
       className=${'fixed bottom-5 right-5 z-50 flex items-center gap-2.5 rounded-full bg-[#25D366] px-5 py-3.5 font-bold text-[#0A0714] shadow-2xl transition-all duration-300 hover:scale-105 ' +
         (visivel ? 'translate-y-0 opacity-100' : 'pointer-events-none translate-y-6 opacity-0')}>
      <${Ico} d=${ICONES.whats} className="h-5 w-5" />
      <span className="hidden sm:inline">Falar agora</span>
      <span className="sr-only sm:hidden">Falar agora no WhatsApp</span>
    </a>`;
}
